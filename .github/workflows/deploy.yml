name: Build and Deploy Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra

      - name: Compile resume.tex to PDF
        run: |
          mkdir -p _site _build
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=_build resume.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=_build resume.tex
          cp _build/resume.pdf _site/Gabriel_Nsengiyumva_External_Resume.pdf
          pages=$(grep -oE 'Output written on .* \([0-9]+ pages?' _build/resume.log | grep -oE '[0-9]+' | tail -1)
          echo "PDF compiled: ${pages} page(s)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${pages:-1}" -gt 1 ]; then
            echo "::warning::Compiled PDF is ${pages} pages (expected 1 page)."
          fi

      - name: Generate website HTML and sitemap from resume.tex
        run: |
          python3 .github/scripts/tex2html.py resume.tex _site
          cp robots.txt _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
